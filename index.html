<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#212121" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iPhone "Add to Home Screen": icon, title and full-screen launch -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="chess-anlzr" />
    <title>Chess Analyzer</title>
    <script>
      // Apply a saved cream theme before first paint (night is the CSS default). See src/theme.ts.
      try {
        if (localStorage.getItem('chess-anlzr:theme') === 'cream') {
          document.documentElement.dataset.theme = 'cream'
          document.querySelector('meta[name="theme-color"]').content = '#ffe2bd'
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
